<!DOCTYPE html>
<html lang="es" class="bg-mm-cream">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikiloc - Modo Monte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mm-terracotta': '#BD917E',
                        'mm-cream': '#F3Ece6',
                        'mm-beige': '#E6Dace',
                        'mm-sage': '#6D7561',
                        'mm-brown': '#8C5A3B',
                        'mm-dark': '#393939',
                        'mm-footer': '#EAE0D5',
                    },
                    fontFamily: {
                        'arca-bold': ['League Spartan', 'sans-serif'],
                        'arca-heavy': ['League Spartan', 'sans-serif'],
                        'body': ['League Spartan', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'League Spartan', sans-serif;
        }
    </style>
</head>

<body class="antialiased min-h-screen w-full overflow-x-hidden flex flex-col md:flex-row">

    <a href="index.html"
        class="absolute top-4 left-4 md:top-8 md:left-8 z-50 bg-black/30 hover:bg-black/50 text-white rounded-full p-3 backdrop-blur-md transition-all duration-300 shadow-lg flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
    </a>

    <div id="leftPane"
        class="w-full md:w-1/2 lg:w-[50%] h-[50vh] md:h-screen relative bg-black transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center">
        <img id="carouselImage" src="" alt="Wikiloc Modo Monte"
            class="w-full h-full object-cover transition-opacity duration-300">
    </div>

    <div
        class="w-full md:w-1/2 lg:w-[50%] h-auto md:h-screen bg-mm-cream flex flex-col items-center justify-center p-8 md:p-12 lg:p-16 overflow-y-auto relative">
        <div id="textContent"
            class="max-w-3xl w-full text-mm-brown text-center flex flex-col items-center justify-center transition-opacity duration-300">
            
        </div>

        <div class="absolute bottom-8 right-8 z-20 flex gap-4">
            <button onclick="prevSlide()"
                class="bg-black/30 hover:bg-black/50 backdrop-blur-md text-white rounded-full p-3 transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <button onclick="nextSlide()"
                class="bg-black/30 hover:bg-black/50 backdrop-blur-md text-white rounded-full p-3 transition-colors">
                <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script>
        const slides = [
            {
                image: './images/Wikiloc/FRAN Y AMA.webp',
                isMap: false,
                html: `
                    <p class="text-3xl md:text-4xl font-semibold mb-2">Descargá la app.</p>
                    <h1 class="text-6xl md:text-8xl font-arca-bold tracking-widest uppercase text-mm-brown mb-4">WIKILOC</h1>
                    <p class="text-lg md:text-xl font-semibold mb-6">Escaneá el QR<br>e ingresá en nuestro perfil!</p>
                    <div class="w-[280px] h-[280px] md:w-[350px] md:h-[350px] overflow-hidden flex items-center justify-center mb-8 mx-auto">
                        <img src="./images/Wikiloc/ICONO TREKKING-21.png" alt="QR Code" class="w-full h-full object-contain scale-[1.8]">
                    </div>
                    <p class="text-2xl md:text-3xl font-semibold">Registrate con tu cuenta<br>Y comenzá la aventura</p>
                `
            },
            {
                image: './images/Wikiloc/ICONO TREKKING-22.png',
                isMap: true,
                html: `
                    <div class="space-y-12 max-w-md mx-auto text-lg md:text-xl font-semibold leading-relaxed">
                        <p class="relative">
                            Para seguir los recorridos con<br>
                            todas las funciones se requiere la<br>
                            suscripción <span class="font-bold underline decoration-wavy underline-offset-4">premium</span>
                            <span class="block text-base mt-2 font-normal">(tenes 14 días gratis)</span>
                            
                            <svg class="absolute -right-8 top-12 w-8 h-8 text-mm-brown transform rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        </p>
                        
                        <p>
                            Cuando seguís el track, Wikiloc<br>
                            comienza a grabar tu recorrido.
                        </p>

                        <p>
                            Te guía sobre nuestro track y se<br>
                            activaran alarmas sonoras si te<br>
                            desvias.
                        </p>

                        <p>
                            Sino podes ver las rutas<br>
                            y tomar referencias!
                        </p>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function updateSlide() {
            const slide = slides[currentSlide];
            const textContent = document.getElementById('textContent');
            textContent.style.opacity = '0';
            const img = document.getElementById('carouselImage');
            const leftPane = document.getElementById('leftPane');
            const changingImage = img.src !== new URL(slide.image, document.baseURI).href;
            if (changingImage) {
                img.style.opacity = '0';
            }

            setTimeout(() => {
                textContent.innerHTML = slide.html;
                textContent.style.opacity = '1';

                if (changingImage) {
                    img.src = slide.image;
                    if (slide.isMap) {
                        img.className = "w-[90%] h-[90%] object-contain transition-opacity duration-300";
                        leftPane.className = "w-full md:w-1/2 lg:w-[50%] h-[50vh] md:h-screen relative bg-mm-brown transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center";
                    } else {
                        img.className = "w-full h-full object-cover transition-opacity duration-300";
                        leftPane.className = "w-full md:w-1/2 lg:w-[50%] h-[50vh] md:h-screen relative bg-black transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center";
                    }
                    img.style.opacity = '1';
                }
            }, 150);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateSlide();
            lucide.createIcons();
        });
    </script>
</body>

</html>

        let currentModalImages = [];
        let currentImageIndex = 0;

        function openModal(id) {
            const data = caminatas[id];
            if (!data) return;

            currentModalImages = data.images;
            currentImageIndex = 0;

            document.getElementById('modalTitle').textContent = data.title;
            document.getElementById('modalDescription').innerHTML = data.description;

            const amenitiesList = document.getElementById('modalAmenities');
            amenitiesList.innerHTML = '';
            if (data.amenities && data.amenities.length > 0) {
                data.amenities.forEach(item => {
                    amenitiesList.innerHTML += `<li class="flex items-start gap-2 md:gap-3"><i data-lucide="${item.icon}" class="w-4 h-4 md:w-5 md:h-5 text-mm-terracotta mt-0.5 shrink-0"></i> <div>${item.text}</div></li>`;
                });
            }

            const footer = document.getElementById('modalFooter');
            if (data.footer) {
                footer.textContent = data.footer;
                footer.style.display = 'block';
            } else {
                footer.style.display = 'none';
            }

            updateModalImage();
            renderDots();

            const modal = document.getElementById('domoModal');
            const content = document.getElementById('modalContent');

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');

            content.classList.remove('scale-95');
            content.classList.add('scale-100');
            const prevBtn = modal.querySelector('button[onclick="prevImage()"]');
            const nextBtn = modal.querySelector('button[onclick="nextImage()"]');
            if (currentModalImages.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
                nextBtn.style.display = 'block';
            }
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('domoModal');
            const content = document.getElementById('modalContent');

            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');

            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function nextImage() {
            if (currentModalImages.length <= 1) return;
            currentImageIndex = (currentImageIndex + 1) % currentModalImages.length;
            updateModalImage();
            updateDots();
        }

        function prevImage() {
            if (currentModalImages.length <= 1) return;
            currentImageIndex = (currentImageIndex - 1 + currentModalImages.length) % currentModalImages.length;
            updateModalImage();
            updateDots();
        }

        function updateModalImage() {
            const img = document.getElementById('modalImage');
            img.style.opacity = '0.5';
            setTimeout(() => {
                img.src = currentModalImages[currentImageIndex];
                img.style.opacity = '1';
            }, 150);
        }

        function renderDots() {
            const dotsContainer = document.getElementById('modalDots');
            dotsContainer.innerHTML = '';

            if (currentModalImages.length <= 1) return;

            currentModalImages.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 md:w-2.5 md:h-2.5 rounded-full transition-all duration-300 ${idx === currentImageIndex ? 'bg-white scale-125' : 'bg-white/50 hover:bg-white/80'}`;
                dot.onclick = () => {
                    currentImageIndex = idx;
                    updateModalImage();
                    updateDots();
                };
                dotsContainer.appendChild(dot);
            });
        }

        function updateDots() {
            const dotsContainer = document.getElementById('modalDots');
            Array.from(dotsContainer.children).forEach((dot, idx) => {
                if (idx === currentImageIndex) {
                    dot.className = 'w-2 h-2 md:w-2.5 md:h-2.5 rounded-full transition-all duration-300 bg-white scale-125';
                } else {
                    dot.className = 'w-2 h-2 md:w-2.5 md:h-2.5 rounded-full transition-all duration-300 bg-white/50 hover:bg-white/80';
                }
            });
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        document.getElementById('domoModal').addEventListener('click', (e) => {
            if (e.target.id === 'domoModal') closeModal();
        });

        lucide.createIcons();
    </script>
</body>

</html>
